name: Build and Test

on:
  push:
    branches: [main, binkos]
  pull_request:
    branches: [main, binkos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Check generated backup schema
        run: |
          python3 tools/generate-backup-schema.py
          git diff --exit-code -- app/src/main/java/com/github/gezimos/inkos/helper/BackupPreferenceSchema.kt
      - name: Compile both variants and run isolated regressions
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:testReleaseUnitTest :app:compileReleaseKotlin :app:lintDebug --console=plain
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-evidence
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
      - name: Upload test APK (no release)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  windows-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fake-adb script regressions (no device)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/tests/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
